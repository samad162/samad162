<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 260" width="100%" height="auto">
  <defs>
    <linearGradient id="cardBgAegis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0E1424" />
      <stop offset="100%" stop-color="#080B12" />
    </linearGradient>
    <radialGradient id="cardGlowAegis" cx="90%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentAegis" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Card Shell -->
  <rect width="580" height="260" rx="16" fill="url(#cardBgAegis)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="580" height="260" rx="16" fill="url(#cardGlowAegis)" />
  <rect x="6" y="6" width="568" height="248" rx="12" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />

  <!-- Left Accent Bar -->
  <rect x="18" y="24" width="4" height="212" rx="2" fill="url(#accentAegis)" />

  <!-- Top Metadata Bar -->
  <g transform="translate(36, 26)">
    <!-- Category Badge -->
    <rect width="165" height="24" rx="6" fill="#132438" stroke="#00F2FE" stroke-opacity="0.4" stroke-width="1" />
    <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10.5" font-weight="700" fill="#38BDF8" letter-spacing="1">VISION FORENSICS</text>

    <!-- Version Badge -->
    <rect x="175" y="0" width="85" height="24" rx="6" fill="#1E293B" />
    <text x="185" y="16" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10.5" font-weight="600" fill="#94A3B8">v2.4 PRO</text>
  </g>

  <!-- Title -->
  <text x="36" y="88" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Geist', sans-serif" font-size="23" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    AEGIS Deepfake Engine PRO
  </text>

  <!-- Description -->
  <text x="36" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">
    Neural vision engine detecting synthetic facial manipulation,
  </text>
  <text x="36" y="138" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">
    spatial boundary artifacts, and frequency anomalies in video.
  </text>

  <!-- Stack Pills -->
  <g transform="translate(36, 168)">
    <rect width="78" height="26" rx="6" fill="#1A2234" stroke="#334155" stroke-width="1" />
    <circle cx="12" cy="13" r="3" fill="#EE4C2C" />
    <text x="22" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">PyTorch</text>

    <g transform="translate(86, 0)">
      <rect width="78" height="26" rx="6" fill="#1A2234" stroke="#334155" stroke-width="1" />
      <circle cx="12" cy="13" r="3" fill="#5C3EE8" />
      <text x="22" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">OpenCV</text>
    </g>

    <g transform="translate(172, 0)">
      <rect width="68" height="26" rx="6" fill="#1A2234" stroke="#334155" stroke-width="1" />
      <circle cx="12" cy="13" r="3" fill="#76B900" />
      <text x="22" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">CUDA</text>
    </g>
  </g>

  <!-- CTA Pill (Bottom Right) -->
  <g transform="translate(416, 206)">
    <rect width="138" height="32" rx="16" fill="#00F2FE" fill-opacity="0.12" stroke="#00F2FE" stroke-opacity="0.5" stroke-width="1" />
    <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#38BDF8" letter-spacing="1">VIEW REPO →</text>
  </g>
</svg>
