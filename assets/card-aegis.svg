<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="auto">
  <defs>
    <linearGradient id="bgAegis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0D1524" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>
    <radialGradient id="glowAegis" cx="95%" cy="10%" r="65%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="lineAegis" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Outer Double-Bezel Shell -->
  <rect width="600" height="300" rx="18" fill="url(#bgAegis)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="600" height="300" rx="18" fill="url(#glowAegis)" />
  <rect x="7" y="7" width="586" height="286" rx="13" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />

  <!-- Accent Edge Indicator -->
  <rect x="22" y="24" width="4" height="252" rx="2" fill="url(#lineAegis)" />

  <!-- Top Metadata Header -->
  <g transform="translate(42, 28)">
    <rect width="165" height="26" rx="6" fill="#0C2033" stroke="#00F2FE" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="14" cy="13" r="3.5" fill="#00F2FE" />
    <text x="24" y="17" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10.5" font-weight="700" fill="#38BDF8" letter-spacing="1">VISION FORENSICS</text>

    <!-- Metric Chip -->
    <rect x="420" y="0" width="115" height="26" rx="6" fill="#132B25" stroke="#10B981" stroke-opacity="0.5" stroke-width="1" />
    <text x="432" y="17" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10.5" font-weight="700" fill="#34D399">98.4% ACCURACY</text>
  </g>

  <!-- Project Title -->
  <text x="42" y="94" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Geist', sans-serif" font-size="24" font-weight="850" fill="#FFFFFF" letter-spacing="-0.5">
    AEGIS Deepfake Engine PRO
  </text>

  <!-- Subtitle -->
  <text x="42" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#94A3B8">
    Deep vision forensics detecting synthetic manipulation &amp; boundary artifacts.
  </text>

  <!-- Technical Telemetry Box (Bento Spec) -->
  <g transform="translate(42, 144)">
    <rect width="514" height="66" rx="10" fill="#0E1626" stroke="#1E2A3F" stroke-width="1" />

    <!-- Spec 1 -->
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1">BOUNDARY ARTIFACTS</text>
    <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="13" font-weight="700" fill="#38BDF8">Spatial Gradient Analyzed</text>

    <!-- Vertical Divider -->
    <line x1="260" y1="12" x2="260" y2="54" stroke="#1E293B" stroke-width="1" />

    <!-- Spec 2 -->
    <text x="280" y="24" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1">FREQUENCY DOMAIN</text>
    <text x="280" y="48" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="13" font-weight="700" fill="#34D399">FFT Anomaly Verified</text>
  </g>

  <!-- Bottom Action Row -->
  <g transform="translate(42, 236)">
    <!-- Tech Tags -->
    <rect width="76" height="26" rx="6" fill="#182236" stroke="#334155" stroke-width="1" />
    <circle cx="12" cy="13" r="3" fill="#EE4C2C" />
    <text x="22" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">PyTorch</text>

    <g transform="translate(84, 0)">
      <rect width="76" height="26" rx="6" fill="#182236" stroke="#334155" stroke-width="1" />
      <circle cx="12" cy="13" r="3" fill="#5C3EE8" />
      <text x="22" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">OpenCV</text>
    </g>

    <g transform="translate(168, 0)">
      <rect width="66" height="26" rx="6" fill="#182236" stroke="#334155" stroke-width="1" />
      <circle cx="12" cy="13" r="3" fill="#76B900" />
      <text x="22" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">CUDA</text>
    </g>

    <!-- Button-in-Button CTA -->
    <g transform="translate(366, -2)">
      <rect width="148" height="30" rx="15" fill="#00F2FE" fill-opacity="0.12" stroke="#00F2FE" stroke-opacity="0.5" stroke-width="1" />
      <text x="18" y="19.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#38BDF8" letter-spacing="1">INSPECT ENGINE</text>
      <circle cx="132" cy="15" r="9" fill="#00F2FE" fill-opacity="0.2" />
      <text x="129" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#38BDF8">→</text>
    </g>
  </g>
</svg>
