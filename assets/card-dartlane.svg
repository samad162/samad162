<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 260" width="100%" height="auto">
  <defs>
    <linearGradient id="cardBgDartlane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0E191A" />
      <stop offset="100%" stop-color="#080B12" />
    </linearGradient>
    <radialGradient id="cardGlowDartlane" cx="90%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentDartlane" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Card Shell -->
  <rect width="580" height="260" rx="16" fill="url(#cardBgDartlane)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="580" height="260" rx="16" fill="url(#cardGlowDartlane)" />
  <rect x="6" y="6" width="568" height="248" rx="12" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />

  <!-- Left Accent Bar -->
  <rect x="18" y="24" width="4" height="212" rx="2" fill="url(#accentDartlane)" />

  <!-- Top Metadata Bar -->
  <g transform="translate(36, 26)">
    <!-- Category Badge -->
    <rect width="180" height="24" rx="6" fill="#132B25" stroke="#10B981" stroke-opacity="0.5" stroke-width="1" />
    <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10.5" font-weight="700" fill="#34D399" letter-spacing="1">PIPELINE RUNNER</text>

    <!-- Version Badge -->
    <rect x="190" y="0" width="90" height="24" rx="6" fill="#1E293B" />
    <text x="200" y="16" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10.5" font-weight="600" fill="#94A3B8">FASTLANE-LIKE</text>
  </g>

  <!-- Title -->
  <text x="36" y="88" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Geist', sans-serif" font-size="23" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    Dartlane
  </text>

  <!-- Description -->
  <text x="36" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">
    Fast, flexible Dart-powered CLI tool to define, automate,
  </text>
  <text x="36" y="138" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">
    and run build lanes and deployment tasks across Flutter projects.
  </text>

  <!-- Stack Pills -->
  <g transform="translate(36, 168)">
    <rect width="70" height="26" rx="6" fill="#1A2234" stroke="#334155" stroke-width="1" />
    <circle cx="12" cy="13" r="3" fill="#0175C2" />
    <text x="22" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Dart</text>

    <g transform="translate(78, 0)">
      <rect width="105" height="26" rx="6" fill="#1A2234" stroke="#334155" stroke-width="1" />
      <circle cx="12" cy="13" r="3" fill="#10B981" />
      <text x="22" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Automation</text>
    </g>

    <g transform="translate(191, 0)">
      <rect width="80" height="26" rx="6" fill="#1A2234" stroke="#334155" stroke-width="1" />
      <circle cx="12" cy="13" r="3" fill="#6366F1" />
      <text x="22" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">CLI Tool</text>
    </g>
  </g>

  <!-- CTA Pill (Bottom Right) -->
  <g transform="translate(416, 206)">
    <rect width="138" height="32" rx="16" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.5" stroke-width="1" />
    <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#34D399" letter-spacing="1">VIEW REPO →</text>
  </g>
</svg>
