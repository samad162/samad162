<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="auto">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>
  </defs>

  <!-- Terminal Window Shell -->
  <rect width="880" height="320" rx="14" fill="url(#termBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <rect width="880" height="38" rx="14" fill="#0F1422" />
  <rect y="24" width="880" height="14" fill="#0F1422" />
  <line x1="0" y1="38" x2="880" y2="38" stroke="#1E293B" stroke-width="1" />

  <!-- macOS Window Controls -->
  <circle cx="22" cy="19" r="6" fill="#FF5F56" />
  <circle cx="42" cy="19" r="6" fill="#FFBD2E" />
  <circle cx="62" cy="19" r="6" fill="#27C93F" />

  <!-- Window Title -->
  <text x="440" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Mono', monospace" font-size="12" font-weight="600" fill="#94A3B8">
    samad@neural-station: ~ (zsh)
  </text>

  <!-- Terminal Content Body -->
  <g transform="translate(24, 66)" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13">
    <!-- Line 1 -->
    <text x="0" y="0">
      <tspan fill="#38BDF8">➜</tspan>
      <tspan fill="#A5B4FC" font-weight="600"> ~ </tspan>
      <tspan fill="#F8FAFC">whoami</tspan>
    </text>
    <text x="0" y="22" fill="#94A3B8">
      Abdulsamad. S <tspan fill="#64748B">—</tspan> AI &amp; Data Science @ Selvam College of Technology (Namakkal, IN)
    </text>

    <!-- Line 2 -->
    <text x="0" y="56">
      <tspan fill="#38BDF8">➜</tspan>
      <tspan fill="#A5B4FC" font-weight="600"> ~ </tspan>
      <tspan fill="#F8FAFC">cat capabilities.json</tspan>
    </text>
    <text x="0" y="78" fill="#FCD34D">{</text>
    <text x="20" y="98" fill="#E2E8F0">
      <tspan fill="#38BDF8">"focus"</tspan>: [<tspan fill="#34D399">"Vision Forensics"</tspan>, <tspan fill="#34D399">"Deepfake Detection"</tspan>, <tspan fill="#34D399">"Flutter CLI Architectures"</tspan>],
    </text>
    <text x="20" y="118" fill="#E2E8F0">
      <tspan fill="#38BDF8">"creator_rig"</tspan>: <tspan fill="#34D399">"DaVinci Resolve Studio (Color &amp; Tech Walkthroughs)"</tspan>,
    </text>
    <text x="20" y="138" fill="#E2E8F0">
      <tspan fill="#38BDF8">"status"</tspan>: <tspan fill="#34D399">"● Active for Applied AI &amp; DevTool Engineering"</tspan>
    </text>
    <text x="0" y="158" fill="#FCD34D">}</text>

    <!-- Line 3 -->
    <text x="0" y="194">
      <tspan fill="#38BDF8">➜</tspan>
      <tspan fill="#A5B4FC" font-weight="600"> ~ </tspan>
      <tspan fill="#F8FAFC">git status</tspan>
    </text>
    <text x="0" y="216" fill="#34D399">
      On branch main • 4 flagship repos deployed • 0 vulnerabilities detected
      <tspan fill="#38BDF8">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />_
      </tspan>
    </text>
  </g>
</svg>
