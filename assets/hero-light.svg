<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="glowCyanLight" cx="85%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowIndigoLight" cx="15%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="70%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Subtle Grid -->
    <pattern id="gridLight" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0F172A" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="380" rx="20" fill="url(#bgGradLight)" />
  <rect width="1200" height="380" rx="20" fill="url(#gridLight)" />
  <rect width="1200" height="380" rx="20" fill="url(#glowCyanLight)" />
  <rect width="1200" height="380" rx="20" fill="url(#glowIndigoLight)" />

  <!-- Outer Glass Frame -->
  <rect x="12" y="12" width="1176" height="356" rx="16" fill="none" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Corner Brackets -->
  <path d="M 28 44 L 28 28 L 44 28" fill="none" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 1172 44 L 1172 28 L 1156 28" fill="none" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 28 336 L 28 352 L 44 352" fill="none" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 1172 336 L 1172 352 L 1156 352" fill="none" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" />

  <!-- Top Metadata Bar -->
  <g transform="translate(48, 54)">
    <!-- Eyebrow Pill -->
    <rect width="260" height="28" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#0284C7">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0F172A" letter-spacing="2">SYSTEM LABS // @SAMAD162</text>

    <!-- Location & Status -->
    <text x="750" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Mono', monospace" font-size="11" font-weight="600" fill="#64748B" letter-spacing="1.5">NAMAKKAL, IN  •  AI &amp; DATA SCIENCE @ SELVAM</text>
  </g>

  <!-- Main Hero Title -->
  <text x="48" y="168" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Geist', 'Inter', sans-serif" font-size="70" font-weight="850" fill="url(#textGradLight)" letter-spacing="-2">
    ABDULSAMAD S.
  </text>

  <!-- Subtitle with Color Accents -->
  <text x="50" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Geist Mono', monospace" font-size="16.5" font-weight="600" fill="#475569" letter-spacing="3.5">
    AI/ML ENGINEER  <tspan fill="#0284C7">/</tspan>  FLUTTER ARCHITECT  <tspan fill="#6366F1">/</tspan>  CONTENT CREATOR
  </text>

  <!-- Divider Line -->
  <line x1="50" y1="246" x2="1150" y2="246" stroke="#E2E8F0" stroke-width="1" />

  <!-- Bottom Navigation / Domain Pills -->
  <g transform="translate(50, 274)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="250" height="42" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <circle cx="20" cy="21" r="4" fill="#0284C7" />
      <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Computer Vision Forensics</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(266, 0)">
      <rect width="240" height="42" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <circle cx="20" cy="21" r="4" fill="#6366F1" />
      <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Flutter &amp; Dart Tooling</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(522, 0)">
      <rect width="260" height="42" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <circle cx="20" cy="21" r="4" fill="#059669" />
      <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Static ML Risk Prediction</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(798, 0)">
      <rect width="300" height="42" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <circle cx="20" cy="21" r="4" fill="#DB2777" />
      <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#0F172A">DaVinci Resolve Tech Media</text>
    </g>
  </g>
</svg>
