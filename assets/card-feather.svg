<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 260" width="100%" height="auto">
  <defs>
    <linearGradient id="cardBgFeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111326" />
      <stop offset="100%" stop-color="#080B12" />
    </linearGradient>
    <radialGradient id="cardGlowFeather" cx="90%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentFeather" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- Card Shell -->
  <rect width="580" height="260" rx="16" fill="url(#cardBgFeather)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="580" height="260" rx="16" fill="url(#cardGlowFeather)" />
  <rect x="6" y="6" width="568" height="248" rx="12" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />

  <!-- Left Accent Bar -->
  <rect x="18" y="24" width="4" height="212" rx="2" fill="url(#accentFeather)" />

  <!-- Top Metadata Bar -->
  <g transform="translate(36, 26)">
    <!-- Category Badge -->
    <rect width="180" height="24" rx="6" fill="#1C1F38" stroke="#6366F1" stroke-opacity="0.5" stroke-width="1" />
    <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10.5" font-weight="700" fill="#A5B4FC" letter-spacing="1">FLUTTER ECOSYSTEM</text>

    <!-- Version Badge -->
    <rect x="190" y="0" width="105" height="24" rx="6" fill="#1E293B" />
    <text x="200" y="16" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10.5" font-weight="600" fill="#94A3B8">OPEN SOURCE</text>
  </g>

  <!-- Title -->
  <text x="36" y="88" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Geist', sans-serif" font-size="23" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    Feather UI Design System
  </text>

  <!-- Description -->
  <text x="36" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">
    Prebuilt Flutter component library, modern widget system,
  </text>
  <text x="36" y="138" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">
    CLI project scaffolding tool, and instant live preview playground.
  </text>

  <!-- Stack Pills -->
  <g transform="translate(36, 168)">
    <rect width="78" height="26" rx="6" fill="#1A2234" stroke="#334155" stroke-width="1" />
    <circle cx="12" cy="13" r="3" fill="#02569B" />
    <text x="22" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Flutter</text>

    <g transform="translate(86, 0)">
      <rect width="68" height="26" rx="6" fill="#1A2234" stroke="#334155" stroke-width="1" />
      <circle cx="12" cy="13" r="3" fill="#0175C2" />
      <text x="22" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Dart</text>
    </g>

    <g transform="translate(162, 0)">
      <rect width="90" height="26" rx="6" fill="#1A2234" stroke="#334155" stroke-width="1" />
      <circle cx="12" cy="13" r="3" fill="#6366F1" />
      <text x="22" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">UI System</text>
    </g>
  </g>

  <!-- CTA Pill (Bottom Right) -->
  <g transform="translate(416, 206)">
    <rect width="138" height="32" rx="16" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-opacity="0.5" stroke-width="1" />
    <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#A5B4FC" letter-spacing="1">VIEW REPO →</text>
  </g>
</svg>
