<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050608" />
      <stop offset="50%" stop-color="#090B10" />
      <stop offset="100%" stop-color="#06070A" />
    </linearGradient>

    <!-- Ambient Glow 1 (Cyan) -->
    <radialGradient id="glowCyan" cx="80%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Glow 2 (Indigo) -->
    <radialGradient id="glowIndigo" cx="20%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#4338ca" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />
  <rect width="1200" height="360" fill="url(#glowCyan)" />
  <rect width="1200" height="360" fill="url(#glowIndigo)" />

  <!-- Outer Double-Bezel Frame -->
  <rect x="18" y="18" width="1164" height="324" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />
  <rect x="24" y="24" width="1152" height="312" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" />

  <!-- Technical Corner Accents -->
  <path d="M 36 50 L 36 36 L 50 36" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.8" />
  <path d="M 1164 50 L 1164 36 L 1150 36" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.8" />
  <path d="M 36 310 L 36 324 L 50 324" fill="none" stroke="#6366F1" stroke-width="2" stroke-opacity="0.8" />
  <path d="M 1164 310 L 1164 324 L 1150 324" fill="none" stroke="#6366F1" stroke-width="2" stroke-opacity="0.8" />

  <!-- Eyebrow Pill Badge -->
  <g transform="translate(60, 68)">
    <rect width="280" height="26" rx="13" fill="#1E293B" fill-opacity="0.6" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="13" r="4" fill="#38BDF8" />
    <text x="28" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Geist', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" letter-spacing="2">SYSTEM LABS // @SAMAD162</text>
  </g>

  <!-- Live Status Tag (Right Aligned) -->
  <g transform="translate(930, 68)">
    <rect width="210" height="26" rx="13" fill="#141E1C" fill-opacity="0.7" stroke="#10B981" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="16" cy="13" r="3.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Geist', sans-serif" font-size="10.5" font-weight="600" fill="#34D399" letter-spacing="1.5">OPEN FOR RESEARCH</text>
  </g>

  <!-- Main Name Typography -->
  <text x="60" y="172" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Geist', 'Outfit', sans-serif" font-size="64" font-weight="800" fill="url(#textGrad)" letter-spacing="-1.5">
    ABDULSAMAD S.
  </text>

  <!-- Editorial Subtitle -->
  <text x="62" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Geist Mono', monospace" font-size="17" font-weight="500" fill="#94A3B8" letter-spacing="3.5">
    AI &amp; VISION RESEARCHER  <tspan fill="#38BDF8">/</tspan>  DEVTOOL ARCHITECT  <tspan fill="#6366F1">/</tspan>  TECH CREATOR
  </text>

  <!-- Micro Divider Line -->
  <line x1="62" y1="244" x2="1138" y2="244" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />

  <!-- Bottom Telemetry Chips -->
  <g transform="translate(62, 270)">
    <!-- Metric 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" font-weight="600" fill="#64748B" letter-spacing="1.5">CORE DOMAINS</text>
      <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Geist', sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">Computer Vision • Deepfake Forensics • Edge Optimization</text>
    </g>

    <!-- Metric 2 -->
    <g transform="translate(560, 0)">
      <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" font-weight="600" fill="#64748B" letter-spacing="1.5">CREATOR STACK</text>
      <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Geist', sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">DaVinci Resolve Studio • Technical Breakdowns • Open Source</text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(980, 0)">
      <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" font-weight="600" fill="#64748B" letter-spacing="1.5">LOCATION</text>
      <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Geist', sans-serif" font-size="14" font-weight="600" fill="#38BDF8">Namakkal, IN</text>
    </g>
  </g>
</svg>
